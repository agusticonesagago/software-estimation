name: CI

on:
  push:
    branches: [session_*]
  pull_request:
    branches: [session_*]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    env:
      # Placeholder so Settings validates at startup; no real LLM calls in CI.
      OPENAI_API_KEY: sk-ci-placeholder
      LLM_PROVIDER: openai
      LLM_MODEL: gpt-4o-mini
      APP_ENV: test
      LOG_LEVEL: INFO

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies (incl. dev)
        run: uv sync --frozen --group dev

      - name: Run unit, integration, and e2e tests (coverage ≥ 90%)
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=90

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: software-estimation:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container and check /health over HTTP
        run: |
          docker run -d --name software-estimation-ci \
            -p 8000:8000 \
            -e OPENAI_API_KEY \
            -e LLM_PROVIDER \
            -e LLM_MODEL \
            -e APP_ENV \
            -e LOG_LEVEL \
            software-estimation:ci

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo
              echo "docker health ok"
              docker stop software-estimation-ci >/dev/null
              exit 0
            fi
            sleep 1
          done

          echo "Container failed to become healthy"
          docker logs software-estimation-ci
          exit 1
