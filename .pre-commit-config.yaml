repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, perf, test, build, ci, chore]

  - repo: local
    hooks:
      - id: pytest-coverage-90
        name: pytest coverage ≥ 90%
        entry: bash -c 'OPENAI_API_KEY="${OPENAI_API_KEY:-sk-ci-placeholder}" LLM_PROVIDER="${LLM_PROVIDER:-openai}" uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=90 -q'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
