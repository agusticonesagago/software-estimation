[project]
name = "software-estimation"
version = "0.1.0"
description = "FastAPI software estimation service with versioned Jinja2 prompts"
readme = "README.md"
authors = [
    { name = "Agustí Conesa Gago" },
]
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.146.0",
    "jinja2>=3.1.6",
    "litellm>=1.106.0",
    "openai>=2.54.0",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "streamlit>=1.66.1",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Keep versioned Jinja2 templates inside the installed package / Docker image.
[tool.hatch.build.targets.wheel.force-include]
"app/prompts" = "app/prompts"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.14.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/**/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 90
